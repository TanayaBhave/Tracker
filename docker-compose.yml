services:
  app:
    build: .
    # Published on all interfaces so tailscale serve (host-level) can reach it.
    # If you want it unreachable from the plain LAN too, use "127.0.0.1:8080:8080"
    # — tailscale serve forwards to localhost, so HTTPS access keeps working.
    ports:
      - "8080:8080"
    volumes:
      # SQLite database (baby.sqlite + -wal/-shm) survives rebuilds/restarts.
      - ./data:/data
    env_file: .env # SYNC_TOKEN (required), USDA_API_KEY (Phase 3+)
    restart: unless-stopped
