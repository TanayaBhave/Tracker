<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="#C8B195"/>

  <g transform="translate(256, 256)">
    <!-- Milestone Starburst Geometry -->
    <path d="M 0,-170 L 32,-48 L 154,-48 L 56,24 L 94,146 L 0,72 L -94,146 L -56,24 L -154,-48 L -32,-48 Z" fill="#AFAFAF"/>
    <path d="M 0,-110 L 22,-32 L 100,-32 L 36,15 L 60,94 L 0,46 L -60,94 L -36,15 L -100,-32 L -22,-32 Z" fill="#D9C9B6" opacity="0.15"/>

    <!-- Outer Diamond Accent Points -->
    <path d="M 0,-210 L 12,-180 L -12,-180 Z" fill="#AFAFAF"/>
    <path d="M 210,0 L 180,12 L 180,-12 Z" fill="#AFAFAF"/>
    <path d="M 0,210 L 12,180 L -12,180 Z" fill="#AFAFAF"/>
    <path d="M -210,0 L -180,12 L -180,-12 Z" fill="#AFAFAF"/>

    <!-- Inside Soothing Sprout Silhouette -->
    <g transform="translate(0, 25) scale(1.3)">
      <!-- Main Stem -->
      <path d="M 0,10 Q -2,-15 -8,-35 Q -3,-30 0,-12 Q 3,-30 8,-35 Q 2,-15 0,10 Z" fill="#2C5E43"/>
      <!-- Left Leaf -->
      <path d="M -4,-22 C -18,-26 -24,-14 -14,-4 C -6,-2 -2,-12 -4,-22 Z" fill="#2C5E43"/>
      <!-- Right Leaf -->
      <path d="M 4,-26 C 20,-28 22,-14 12,-6 C 5,-2 2,-14 4,-26 Z" fill="#2C5E43"/>
    </g>
  </g>
</svg>
